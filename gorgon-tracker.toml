# gorgon-tracker configuration (optional; built-in defaults apply otherwise).
# All values shown are defaults. Uncomment and edit to override.

# [db]
# path = "data/gorgon.db"

# [chat]
# log_dir = ""                # auto-detected ChatLog dir when empty (Windows native / Proton library folders)
# tail = true
# poll_interval_s = 1.0       # how often to check for appended chat lines
# tail_from_start = false     # true = parse the whole log file on start

# [playerlog]
# path = ""                   # auto-detected Unity "Player.log" (sibling of ChatLogs) when empty
# tail = true
# poll_interval_s = 1.0       # how often to check for appended Player.log lines
# tail_from_start = false
# backfill_prev = false       # parse Player-prev.log (previous session) once at startup

# [ocr]
# enabled = true
# tesseract_path = "tesseract"
# lang = "eng"

# [ocr.zones]
# region = [1680, 0, 180, 50] # x, y, width, height
# interval_s = 5.0
# heartbeat_s = 30.0          # re-persist an unchanged zone this often (null disables)

# [ocr.targets]
# region = [1021, 691, 213, 114]
# interval_s = 0.5

# [correlate]
# buffer_seconds = 10.0
# activity_window_seconds = 2.0   # loot-window for corpse-description/chat activity markers (whole-second log grains)
# target_fallback_seconds = 3.0   # max age of a target sighting that may attribute loot
# search_corroboration_seconds = 2.0  # same-name corpse search window marking target loot as corpse loot

# [catalog]
# data_dir = ""   # pin item/zone catalog snapshots to a directory (defaults to user data dir)

# [publish]                   # local tool: push verified loot rows to a public server
# enabled = false             # show the Publish action in the local Loot page
# url = ""                    # public server base URL, e.g. "https://loot.example.com"
# token = ""                  # bearer token for that server (must match its [serve] ingest_token)

# [serve]                     # public server: read-only API + public UI + optional ingest
# ingest_enabled = false      # allow POST /api/ingest/loot (write-only publish surface)
# ingest_token = ""           # token required by the ingest endpoint (required when enabled)

[ocr.zones]
region = [3660, 34, 125, 14]

[ocr.targets]
region = [2737, 64, 170, 20]
