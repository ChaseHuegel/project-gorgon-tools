[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gorgon-tracker"
version = "0.1.0"
description = "Cross-platform loot and drop-rate tracker for Project Gorgon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "Pillow>=10.0",
    "mss>=9.0",
    "pytesseract>=0.3.10",
    "watchdog>=4.0",
    "tomlkit>=0.12",
    "jeepney>=0.8",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.112",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
gorgon-tracker = "gorgon_tracker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gorgon_tracker = ["*.sql", "static/index.html", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["gorgon_tracker"]

[[tool.mypy.overrides]]
module = ["pytesseract.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]